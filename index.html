<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fff7f3" />
<title>你和 Crush 的 Match 程度</title>
<style>
  :root{
    --bg:#fff7f3;
    --ink:#3c2a2a;
    --muted:#8e7373;
    --pink:#ff7a9e;
    --pink-deep:#e5486b;
    --pink-soft:#ffe4ea;
    --cream:#fffaf5;
    --gold:#d6a24a;
    --mint:#e9f7f0;
    --lav:#f3e9ff;
    --line:#f3dfe5;
    --shadow:0 18px 44px rgba(229,72,107,.10);
    --radius:26px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 10% -5%, #ffe9f0 0%, transparent 60%),
      radial-gradient(800px 600px at 100% 20%, #fff1dd 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    overflow-x:hidden;
  }
  .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(4px);opacity:.55}
  .b1{width:240px;height:240px;left:-80px;top:6%;background:#ffd6e2}
  .b2{width:180px;height:180px;right:-50px;top:28%;background:#ffe9c9}
  .b3{width:260px;height:260px;left:20%;bottom:-90px;background:#e7f6ef}
  .heart{position:absolute;color:#ff9db4;opacity:.38;font-size:20px;animation:float 7s ease-in-out infinite}
  .h1{left:8%;top:18%;animation-delay:-1s}
  .h2{right:9%;top:12%;font-size:14px;animation-delay:-3s}
  .h3{left:14%;bottom:18%;font-size:16px;animation-delay:-5s}
  .h4{right:15%;bottom:26%;font-size:12px;animation-delay:-2s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(8deg)}}
  .phone{
    position:relative;z-index:1;width:min(100%,520px);
    min-height:100vh;padding:18px 18px 34px;
  }
  @media(min-width:640px){
    .phone{margin:24px 0;min-height:calc(100vh - 48px);background:rgba(255,255,255,.62);
      border-radius:42px;box-shadow:0 30px 80px rgba(229,72,107,.12);backdrop-filter:blur(8px);
      padding:24px 26px 38px;border:1px solid rgba(255,255,255,.8)}
  }
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:.2px}
  .logo{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#ff8fae,#ffb7c8);color:#fff;font-size:15px;box-shadow:0 6px 14px rgba(229,72,107,.22)}
  .step-label{font-size:11.5px;color:var(--muted);letter-spacing:.5px}
  .progress{height:6px;background:#ffe6ec;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .progress i{display:block;height:100%;width:25%;border-radius:999px;
    background:linear-gradient(90deg,#ff8fae,#e5486b);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .screen{animation:fadeUp .45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;margin:4px 0 8px}
  h1{font-size:31px;line-height:1.18;margin:0 0 10px;letter-spacing:-.5px}
  h1 .hl{color:var(--pink-deep);white-space:nowrap;background:linear-gradient(transparent 62%, #ffe0e8 62%);border-radius:5px;padding:0 2px}
  .lead{font-size:13.5px;line-height:1.75;color:var(--muted);margin:0 0 16px}
  .card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-head b{font-size:14.5px}
  .hint{font-size:10.5px;color:var(--muted);background:#fff3f6;border-radius:999px;padding:4px 9px}
  .grid-mbti{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mbti{border:1.5px solid #f2dfe5;background:#fffaf8;border-radius:15px;padding:9px 3px;text-align:center;
    cursor:pointer;transition:.18s;color:var(--ink);font-family:inherit;min-height:54px}
  .mbti b{display:block;font-size:12.5px;letter-spacing:.3px}
  .mbti span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .mbti:hover{border-color:#ffb8c9;transform:translateY(-1px)}
  .mbti.selected{background:linear-gradient(135deg,#ff8fae,#e5486b);border-color:transparent;color:#fff;
    box-shadow:0 8px 18px rgba(229,72,107,.22);transform:translateY(-1px)}
  .mbti.selected span{color:rgba(255,255,255,.82)}
  .grid-zodiac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .zodiac{border:1.5px solid #f2dfe5;background:#fffaf8;border-radius:15px;padding:8px 2px;text-align:center;
    cursor:pointer;transition:.18s;color:var(--ink);font-family:inherit;min-height:54px}
  .zodiac em{display:block;font-style:normal;font-size:17px;color:var(--gold);line-height:1.1}
  .zodiac span{display:block;font-size:9.5px;color:var(--muted);margin-top:1px}
  .zodiac:hover{border-color:#ffd39f;transform:translateY(-1px)}
  .zodiac.selected{background:linear-gradient(135deg,#ffe6b8,#f4c77c);border-color:transparent;color:#6b4a16;
    box-shadow:0 8px 18px rgba(214,162,74,.18)}
  .zodiac.selected span{color:#7c5a25}
  .btn{display:block;width:100%;border:0;border-radius:18px;padding:15px 16px;font-family:inherit;
    font-size:15.5px;font-weight:800;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#ff8fae,#e5486b);box-shadow:0 14px 26px rgba(229,72,107,.22);
    transition:.2s;margin-top:6px}
  .btn:hover{transform:translateY(-1px);box-shadow:0 18px 30px rgba(229,72,107,.28)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:1.5px solid #ffd0db;box-shadow:none}
  .btn.ghost:hover{background:#fff7fa;box-shadow:none}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note{font-size:11px;line-height:1.7;color:var(--muted);margin:10px 2px 0}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
  .back{border:0;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;
    font-size:22px;line-height:1;color:var(--pink-deep);cursor:pointer;font-family:inherit}
  .dim-pill{font-size:10.5px;color:var(--pink-deep);background:#fff0f4;border-radius:999px;padding:5px 10px}
  .q-count{font-size:11px;color:var(--muted);letter-spacing:.5px}
  .mini-progress{height:5px;background:#ffe6ec;border-radius:999px;overflow:hidden;margin-bottom:16px}
  .mini-progress i{display:block;height:100%;background:linear-gradient(90deg,#ff9db4,#e5486b);border-radius:999px;transition:width .35s}
  .q-card{background:#fff;border:1px solid var(--line);border-radius:30px;padding:20px 18px 18px;box-shadow:var(--shadow)}
  .q-kicker{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;margin-bottom:8px}
  .q-text{font-size:21px;line-height:1.45;margin:0 0 18px;letter-spacing:-.2px}
  .options{display:grid;gap:10px}
  .option{text-align:left;border:1.5px solid #f2dfe5;background:#fffaf8;border-radius:17px;padding:13px 14px;
    font-family:inherit;font-size:13.5px;line-height:1.55;color:var(--ink);cursor:pointer;transition:.18s}
  .option:hover{border-color:#ffb8c9;background:#fff6f9;transform:translateY(-1px)}
  .option.selected{border-color:var(--pink);background:#fff0f5;box-shadow:0 0 0 3px #ffe4ec inset}
  .result-hero{text-align:center;padding:12px 0 6px}
  .score-ring{width:174px;height:174px;border-radius:50%;margin:0 auto 14px;padding:9px;
    background:conic-gradient(var(--pink-deep) calc(var(--score) * 1%), #ffe4ea 0);
    box-shadow:0 18px 40px rgba(229,72,107,.18)}
  .score-inner{width:100%;height:100%;border-radius:50%;background:#fffaf8;display:grid;place-items:center;align-content:center}
  .score-inner b{font-size:49px;line-height:1;color:var(--pink-deep);letter-spacing:-2px}
  .score-inner span{font-size:11px;color:var(--muted);margin-top:6px}
  .grade{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--pink-deep);
    border-radius:999px;padding:7px 14px;letter-spacing:.4px}
  .result-sub{font-size:13px;color:var(--muted);line-height:1.7;margin:10px 18px 0}
  .pills{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:12px}
  .pill{font-size:10.5px;color:#7a5a5a;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .result h3{font-size:14.5px;margin:0 0 9px;color:var(--ink)}
  .result p{font-size:12.8px;line-height:1.8;color:#6f5858;margin:0 0 9px}
  .result p:last-child{margin-bottom:0}
  .dim{margin:12px 0 0}
  .dim-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:6px}
  .dim-head b{color:var(--pink-deep);font-size:12px}
  .bar{height:9px;background:#f9e8ed;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffb2c5,#e5486b);transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .dim small{display:block;font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px}
  .list{margin:0;padding:0;list-style:none}
  .list li{position:relative;padding:8px 0 8px 22px;font-size:12.5px;line-height:1.7;color:#6f5858;border-bottom:1px dashed #f4e2e8}
  .list li:last-child{border-bottom:0}
  .list li:before{content:"♡";position:absolute;left:4px;top:7px;color:var(--pink);font-size:13px}
  .list.warn li:before{content:"!";font-weight:800;color:var(--gold);font-size:12px;left:8px}
  .quote{font-size:13px;line-height:1.8;color:var(--pink-deep);background:#fff4f7;border-radius:18px;padding:14px;margin-top:10px}
  .share-card{background:linear-gradient(145deg,#7a1e2f,#b23a52);border-radius:25px;padding:20px;color:#fff;
    position:relative;overflow:hidden;box-shadow:0 18px 34px rgba(122,30,47,.2);margin:4px 0 14px}
  .share-card:after{content:"♡";position:absolute;right:-12px;bottom:-30px;font-size:140px;color:rgba(255,255,255,.08)}
  .share-top{font-size:10px;letter-spacing:2px;color:#f3d5a8;font-weight:800}
  .share-title{font-size:20px;font-weight:800;margin:6px 0 10px}
  .share-score{font-size:50px;line-height:1;font-weight:800;letter-spacing:-2px}
  .share-score small{font-size:12px;font-weight:400;opacity:.75;letter-spacing:0}
  .share-meta{font-size:11px;color:rgba(255,255,255,.75);margin-top:9px;line-height:1.7}
  .share-tag{display:inline-block;font-size:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
    border-radius:999px;padding:4px 9px;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#3c2a2a;color:#fff;
    font-size:12px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .footer{text-align:center;font-size:10px;color:#b39a9a;line-height:1.7;margin-top:18px}
  @media(max-width:380px){
    h1{font-size:28px}
    .mbti b{font-size:11.5px}.mbti span{font-size:9px}
    .zodiac em{font-size:15px}.zodiac span{font-size:9px}
    .q-text{font-size:19px}
  }
</style>
</head>

/* -----------------------------
   COMPUTE
----------------------------- */
const ELEM = {aries:'fire',leo:'fire',sagittarius:'fire',taurus:'earth',virgo:'earth',capricorn:'earth',
  gemini:'air',libra:'air',aquarius:'air',cancer:'water',scorpio:'water',pisces:'water'};
const PAIR = {fire:'air',air:'fire',earth:'water',water:'earth'};
const OPP = {aries:'libra',libra:'aries',taurus:'scorpio',scorpio:'taurus',gemini:'sagittarius',sagittarius:'gemini',
  cancer:'capricorn',capricorn:'cancer',leo:'aquarius',aquarius:'leo',virgo:'pisces',pisces:'virgo'};
const BEST = [['taurus','cancer'],['taurus','capricorn'],['cancer','scorpio'],['scorpio','pisces'],['virgo','capricorn'],
  ['virgo','taurus'],['leo','aries'],['leo','sagittarius'],['aries','sagittarius'],['gemini','libra'],['libra','aquarius'],
  ['gemini','aquarius'],['pisces','cancer'],['pisces','scorpio']];

function mbtiScore(a,b){
  if(!a || !b) return null;
  const A=a.split(''), B=b.split('');
  let s=55;
  if(a===b) s+=8;
  if(A[1]===B[1]) s+=10; else s-=2;
  if(A[2]!==B[2]) s+=6; else s+=2;
  if(A[0]!==B[0]) s+=4; else s+=2;
  if(A[3]!==B[3]) s+=3; else s+=4;
  const GOLD=[['ENFP','INTJ'],['ENFP','INFJ'],['ENFJ','INFP'],['ENTJ','INTP'],['ESFJ','ISFP'],['ESTJ','ISTP']];
  if(GOLD.some(([x,y])=>(a===x&&b===y)||(a===y&&b===x))) s+=8;
  return clamp(s,35,96);
}

function zodiacScore(z1,z2){
  if(!z1 || !z2) return null;
  if(z1===z2) return clamp(55+2+8+2,35,95);
  const e1=ELEM[z1], e2=ELEM[z2];
  let s=55;
  if(e1===e2) s+=8;
  else if(PAIR[e1]===e2) s+=6;
  else if((e1==='fire'&&e2==='water')||(e1==='water'&&e2==='fire')||(e1==='earth'&&e2==='air')||(e1==='air'&&e2==='earth')) s-=3;
  else s+=2;
  if(OPP[z1]===z2) s+=5;
  if(BEST.some(([x,y])=>(z1===x&&z2===y)||(z1===y&&z2===x))) s+=4;
  return clamp(s,35,95);
}

function quizDims(){
  const sums={}, counts={};
  DIM_ORDER.forEach(k=>{sums[k]=0;counts[k]=0;});
  QUESTIONS.forEach((q,i)=>{
    const v = state.answers[i];
    sums[q.dim] += (v==null?0:v);
    counts[q.dim]++;
  });
  const out={};
  DIM_ORDER.forEach(k=>{
    out[k] = counts[k] ? (sums[k]/(counts[k]*3))*100 : 50;
  });
  return out;
}

function computeDims(){
  const base = quizDims();
  const a=state.me.mbti, b=state.crush.mbti;
  const z1=state.me.zodiac, z2=state.crush.zodiac;
  const d={...base};
  if(a && b){
    const A=a.split(''), B=b.split('');
    d.resonance += (A[1]===B[1]?6:-2);
    d.communication += (A[2]!==B[2]?5:0) + (A[0]!==B[0]?3:0);
    d.repair += (A[3]===B[3]?3:-2);
    d.security += (A[1]===B[1]?3:0) + (A[0]===B[0]?2:0);
    d.pace += (A[3]===B[3]?5:-3);
    d.longterm += (A[1]===B[1]?4:0) + (A[2]!==B[2]?2:0);
  }
  if(z1 && z2){
    const e1=ELEM[z1], e2=ELEM[z2];
    const same=e1===e2, comp=PAIR[e1]===e2, clash=(e1==='fire'&&e2==='water')||(e1==='water'&&e2==='fire')||(e1==='earth'&&e2==='air')||(e1==='air'&&e2==='earth');
    d.resonance += same?5:(comp?3:(clash?-2:1));
    d.communication += comp?3:(same?1:(clash?-2:0));
    d.security += (e1==='earth'&&e2==='water')||(e1==='water'&&e2==='earth')?4:(same?2:(clash?-2:0));
    d.pace += same?3:(comp?2:(clash?-1:0));
    d.longterm += same?4:(comp?2:(OPP[z1]===z2?2:0));
  }
  DIM_ORDER.forEach(k=>{d[k]=clamp(d[k],25,98);});
  return d;
}

function computeResult(){
  const dims = computeDims();
  const qd = quizDims();
  const quizAvg = DIM_ORDER.reduce((s,k)=>s+qd[k],0)/DIM_ORDER.length;
  const ms = mbtiScore(state.me.mbti, state.crush.mbti);
  const zs = zodiacScore(state.me.zodiac, state.crush.zodiac);
  let pair = null;
  if(ms!=null && zs!=null) pair = ms*0.65 + zs*0.35;
  else if(ms!=null) pair = ms;
  else if(zs!=null) pair = zs;
  const overall = clamp(Math.round(quizAvg*0.55 + (pair==null?quizAvg:pair)*0.45), 30, 98);
  return {overall, dims, ms, zs};
}

function gradeInfo(s){
  if(s>=85) return {label:'S 级 · 天选搭子', sub:'高甜预警：你们的默认频道很接近。', quote:'不是谁迁就谁，是刚好同频。'};
  if(s>=75) return {label:'A 级 · 高甜预警', sub:'整体很顺，偶尔需要把话说开。', quote:'你们不是没有问题，是问题来了也愿意一起修。'};
  if(s>=65) return {label:'B 级 · 值得一试', sub:'有火花，也有需要磨合的地方。', quote:'喜欢是起点，翻译彼此才是长期功课。'};
  if(s>=55) return {label:'C 级 · 慢热磨合', sub:'不是不合适，是需要更多翻译。', quote:'一个快一点，一个慢一点，刚好可以等等对方。'};
  return {label:'D 级 · 先观察', sub:'吸引力可能有，但节奏差得有点多。', quote:'先别急着上头，看看你们能不能把话聊完。'};
}

}

function zodiacNarrative(){
  const z1=state.me.zodiac, z2=state.crush.zodiac;

  const a=$zod(z1), b=$zod(z2);

        <div class="quote">${g.quote}</div>
      </div>

      <div class="share-card">
        <div class="share-top">CRUSH MATCH / REPORT</div>
        <div class="share-title">你和 Crush 的 Match 程度</div>
        <div class="share-score">${r.overall}<small> / 100</small></div>
        <div class="share-meta">${state.me.mbti} · ${meZ.name}　×　${state.crush.mbti||'？'}${crZ?' · '+crZ.name:''}<br>${g.label}</div>
        <div class="share-tag">娱乐向测试 · 不构成心理诊断</div>
      </div>

      <div class="btn-row">
        <button class="btn" data-copy type="button">复制结果链接</button>
        <button class="btn ghost" data-restart type="button">再测一次</button>
      </div>
      <p class="note">截图保存这页，或复制链接发给 TA。链接会带上你们的选项，打开就能看到同一份结果。</p>
    </section>`;

  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar i').forEach(el=>{
      el.style.width = el.dataset.w + '%';
    });
  });
  syncUrl(r);
}

function syncUrl(r){
  try{
    const p = new URLSearchParams();
    p.set('a', state.me.mbti); p.set('z1', state.me.zodiac);
    if(state.crush.mbti) p.set('b', state.crush.mbti);
    if(state.crush.zodiac) p.set('z2', state.crush.zodiac);
    p.set('ans', state.answers.map(x=>x==null?0:x).join(''));
    history.replaceState(null,'', location.pathname + '?' + p.toString());
  }catch(e){}
}

/* -----------------------------
   EVENTS
----------------------------- */
app.addEventListener('click', (e)=>{
  const m = e.target.closest('[data-mbti]');
  const z = e.target.closest('[data-zodiac]');
  const cm = e.target.closest('[data-cmbti]');
  const cz = e.target.closest('[data-czodiac]');
  const next = e.target.closest('[data-next]');
  const back = e.target.closest('[data-back]');
  const backMe = e.target.closest('[data-back-me]');
  const opt = e.target.closest('[data-option]');
  const restart = e.target.closest('[data-restart]');
  const copy = e.target.closest('[data-copy]');

  if(m){ state.me.mbti=m.dataset.mbti; renderMe(); return; }
  if(z){ state.me.zodiac=z.dataset.zodiac; renderMe(); return; }
  if(cm){ state.crush.mbti = state.crush.mbti===cm.dataset.cmbti ? null : cm.dataset.cmbti; renderCrush(); return; }
  if(cz){ state.crush.zodiac = state.crush.zodiac===cz.dataset.czodiac ? null : cz.dataset.czodiac; renderCrush(); return; }
  if(next){
    if(state.step===1 && state.me.mbti && state.me.zodiac){ renderCrush(); }
    else if(state.step===2 && (state.crush.mbti||state.crush.zodiac)){ state.qIndex=0; state.answers=Array(QUESTIONS.length).fill(null); renderQuiz(); }
    return;
  }
  if(backMe){ renderMe(); return; }
  if(back){
    if(state.qIndex>0){ state.qIndex--; renderQuiz(); }
    else { renderCrush(); }
    return;
  }
  if(opt){
    const score = Number(opt.dataset.option!=null ? QUESTIONS[state.qIndex].options[Number(opt.dataset.option)].s : 0);
    state.answers[state.qIndex] = score;
    if(state.qIndex >= QUESTIONS.length-1){ renderResult(); }
    else { state.qIndex++; renderQuiz(); }
    return;
  }
  if(restart){
    state.me={mbti:null,zodiac:null}; state.crush={mbti:null,zodiac:null};
    state.qIndex=0; state.answers=Array(QUESTIONS.length).fill(null);
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    renderMe(); return;
  }
  if(copy){
    const p = new URLSearchParams();
    p.set('a', state.me.mbti); p.set('z1', state.me.zodiac);
    if(state.crush.mbti) p.set('b', state.crush.mbti);
    if(state.crush.zodiac) p.set('z2', state.crush.zodiac);
    p.set('ans', state.answers.map(x=>x==null?0:x).join(''));
    const url = location.href.split('?')[0] + '?' + p.toString();
    copyText(url);
    return;
  }
});

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast('结果链接已复制')).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('结果链接已复制'); }
  catch(e){ toast('复制失败，请手动截图'); }
  document.body.removeChild(ta);
}

/* -----------------------------
   INIT / SHARE URL
----------------------------- */
function loadFromUrl(){
  const p = new URLSearchParams(location.search);
  const a=p.get('a'), z1=p.get('z1'), b=p.get('b'), z2=p.get('z2'), ans=p.get('ans');
  if(!a || !z1 || !ans || ans.length!==QUESTIONS.length) return false;
  if(!MBTI_TYPES.some(t=>t.code===a)) return false;
  if(!ZODIAC.some(z=>z.id===z1)) return false;
  if(b && !MBTI_TYPES.some(t=>t.code===b)) return false;
  if(z2 && !ZODIAC.some(z=>z.id===z2)) return false;
  const arr = ans.split('').map(Number);
  if(arr.some(n=>isNaN(n)||n<0||n>3)) return false;
  state.me={mbti:a,zodiac:z1}; state.crush={mbti:b||null,zodiac:z2||null};
  state.answers=arr; state.qIndex=QUESTIONS.length-1;
  renderResult();
  return true;
}

if(!loadFromUrl()) renderMe();
</script>
</body>
</html>
